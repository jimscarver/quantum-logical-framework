# Render.com blueprint — the QuCalc Search service (quantum-os#117).
#
# `qucalc_search.py --serve` is a pure function of `twist_core.py`: read-only,
# stateless, CORS-open, holds no room state. It deploys HERE rather than as a
# quantum-os sidecar because it depends on `twist_core.py`. quantum-os's
# `/search` and `/solve` are the consumers — they point at the URL this service
# gets (`https://<name>.onrender.com`), which is the default baked into
# `packages/browser/src/qucalc-search.ts`.
#
# CONNECT ONCE:  https://dashboard.render.com  ->  New  ->  Blueprint  ->  this
# repo. Render creates the service from this file and gives it its URL. If that
# URL is not exactly `https://quantum-os-qucalc-search.onrender.com`, update
# DEFAULT_SEARCH_CONFIG in quantum-os.
#
# Free plan: the instance sleeps after ~15 min idle and cold-starts in ~50 s
# (same as quantum-os-signaling). The first `/search` after a quiet spell waits
# on that; subsequent ones are sub-second.
services:
  - type: web
    name: quantum-os-qucalc-search
    runtime: python
    plan: free
    # Pure stdlib — nothing to install. Import both modules so a syntax error or
    # a bad `twist_core` fails the build instead of crash-looping the service.
    buildCommand: python3 -c "import twist_core, qucalc_search"
    # Render provides $PORT; bind every interface so its proxy can reach us.
    # Depth cap 7 and 2 concurrent enumerations are the ceiling for a small
    # instance (QucalcSearch.md "How the search stays cheap").
    startCommand: python3 qucalc_search.py --serve --host 0.0.0.0 --port $PORT --max-depth-cap 7 --max-concurrent 2
    healthCheckPath: /
    autoDeploy: true
    # A redeploy just restarts a stateless read-only service, so it is far less
    # disruptive than the signaling server — but there is still no reason for a
    # docs-only push to bounce it. If Render lets you set Build Filters
    # (Settings -> Build & Deploy) on a service it created from this blueprint:
    #
    #   Included Paths:  qucalc_search.py
    #                    twist_core.py
    #                    render.yaml
